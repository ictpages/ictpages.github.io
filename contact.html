<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ict.pages.dev | Contact</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000">
<meta name="description" content="Contact ict.pages.dev via our contact form, mail or phone.">
<meta name="robots" content="index,follow">
<meta name="author" content="ict.pages.dev">
<link rel="canonical" href="https://pages.dev">
<link rel="icon" href="/favicon.ico">

<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{background:#000;color:#fff;font:1.4rem/1.2 Arial,sans-serif;overflow-x:hidden;overflow-y:auto}

h1,h2,p{margin:0}
h1,h2{font-weight:700;line-height:1.1}
a{color:#6688ff;font-weight:700;text-decoration:none}
/* FIX: Zwingt alle Links in Überschriften, exakt die h2-Größe zu erben */
h2 a{font-size:inherit;font-weight:inherit}

#starfield{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:-1;pointer-events:none}

.content-wrap{width:100%;min-height:100vh;min-height:100dvh;padding:20px 20px 10px 20px;display:flex;flex-direction:column;align-items:center;text-align:center}
header,main,footer{position:relative;z-index:1;width:100%;max-width:650px}

header{margin-top:0px;padding-top:20px}
.header-link{display:inline-block;margin-top:0px}

main{flex:1;display:flex;flex-direction:column;align-items:center;gap:24px;margin:24px 0;width:100%}

.contact-content{text-align:left;font-size:1.1rem;line-height:1.4;width:100%}
.contact-content h2{color:#6688ff;font-size:1.4rem;margin:0 0 12px 0;text-align:left}
.contact-content p{margin-bottom:16px}

/* Minimalistisches, sauberes Formular-Styling */
form{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:10px}
input[type="text"], input[type="email"], textarea{width:100%;background:#111;border:1px solid #333;color:#fff;padding:10px;font-family:Arial,sans-serif;font-size:1rem;border-radius:4px;outline:none}
input[type="text"]:focus, input[type="email"]:focus, textarea:focus{border-color:#6688ff}
textarea{resize:vertical;min-height:100px}
button[type="submit"]{background:#6688ff;color:#000;border:none;padding:12px;font-size:1.1rem;font-weight:700;border-radius:4px;cursor:pointer;transition:background 0.2s}
button[type="submit"]:hover{background:#88a5ff}

footer{margin-top:auto;padding-bottom:10px}

@media(max-width:600px){
h1,h2{font-size:2.8rem}
body{font-size:1.1rem}
.contact-content h2{font-size:1.3rem}
.contact-content{font-size:1rem}
}
@media(min-width:601px){
h1,h2{font-size:clamp(1.8rem,4.2vw,2.6rem)}
body{font-size:clamp(.85rem,1.3vw,1.1rem)}
}
@media(min-width:1024px) and (min-height:600px){
h1{font-size:clamp(2rem,3vw,2.8rem)}
h2{font-size:clamp(1.4rem,2.2vw,2rem)}
body{font-size:clamp(.85rem,1vw,1.1rem)}
}
@media(prefers-reduced-motion:reduce){#starfield{display:none}}
</style>

</head>
<body>
<canvas id="starfield" aria-hidden="true"></canvas>
<div class="content-wrap">
<header>
<h1><a href="/" class="header-link" aria-label="ict.pages.dev home">ict.pages.dev</a></h1>
</header>
<main>
<div class="contact-content">
<h2>Contact</h2>
<p>Write an E-Mail via the form below:</p>

<form action="https://web3forms.com" method="POST">
  <input type="hidden" name="access_key" value="68983f16-835a-46b7-ba07-37cd3d60a9b8">
  <input type="text" name="name" placeholder="Your Name" required>
  <input type="email" name="email" placeholder="Your Email Address" required>
  <textarea name="message" placeholder="Your Message" required></textarea>
  <button type="submit">Submit Form</button>
</form>
</div>
<h2><a href="tel:+31684725830" aria-label="Call ict.pages.dev">CALL</a><span aria-hidden="true"> | </span><a href="mailto:ict.pages.dev@gmail.com" aria-label="Email ict.pages.dev">MAIL</a></h2>
</main>
<footer>
  <h2><a href="/">Home</a> | <a href="/about">About</a></h2>
  <p><a href="/legal">Legal</a> | <a href="/privacy">Privacy</a></p>
  <p>© 2026 ict.pages.dev</p>
</footer>
</div>

<script>
(()=>{"use strict";
const c=document.getElementById("starfield"),x=c.getContext("2d",{alpha:false});
if(!x)return;
let w,h,cx,cy,stars=[],frame,timer,running=!document.hidden;
const reduced=matchMedia("(prefers-reduced-motion:reduce)").matches;
const makeStar=(z=1)=>({a:Math.random()*6.283,z:z?Math.random():0,s:.0008+Math.random()*.0018,b:.4+Math.random()*.6});
function resize(){
const d=Math.min(devicePixelRatio||1,1.5);
w=innerWidth;h=innerHeight;cx=w/2;cy=h/2;
c.width=w*d;c.height=h*d;
x.setTransform(d,0,0,d,0,0);
stars=Array.from({length:300},()=>makeStar());
if(reduced)draw();
}
function draw(){
x.fillStyle="#000";
x.fillRect(0,0,w,h);
const max=Math.max(w,h)*.75;
for(const s of stars){
const e=s.z*s.z,d=e*max;
x.beginPath();
x.arc(cx+Math.cos(s.a)*d,cy+Math.sin(s.a)*d,.4+e*2.2,0,6.283);
x.fillStyle=`rgba(255,255,255,${s.b*Math.min(1,e*1.5)})`;
x.fill();
}
}
function animate(){
if(!running)return;
for(const s of stars)s.z+=s.s;
for(let i=0;i<stars.length;i++)if(stars[i].z>=1)stars[i]=makeStar(0);
draw();
frame=requestAnimationFrame(animate);
}
addEventListener("resize",()=>{
clearTimeout(timer);
timer=setTimeout(()=>{
cancelAnimationFrame(frame);
resize();
if(running&&!reduced)animate();
},100);
},{passive:true});
document.addEventListener("visibilitychange",()=>{
running=!document.hidden;
cancelAnimationFrame(frame);
if(running&&!reduced)animate();
});
resize();
if(!reduced)animate();
})();
</script>
</body>
</html>
