/* Canvas als fixierter Hintergrund */
#starfield{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:-1;         /* hinter allem */
  pointer-events:none; /* Klicks gehen durch */
  display:block;
}
/* Content über dem Hintergrund */
header,main,footer{position:relative;z-index:1}

  h1{font-size:2.2rem}
  h2{font-size:2rem}
  p{font-size:1rem}

<body>
<canvas id="starfield"></canvas>

<div class="content-wrap">
<header>
<center>
<h1><a href="/">ict.pages.dev</a></h1>
</center>
</header>
<main>

</center>

</center>
</footer>
</div>

<script>
(function(){
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, CX = 0, CY = 0;
  let stars = [];
  const MAX_DEPTH = 1; // 0 = Zentrum, 1 = Rand
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    CX = W / 2;
    CY = H / 2;

    canvas.width  = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    initStars();
  }

  function initStars() {
    // Sternendichte an Bildschirmgröße anpassen (responsiv)
    const density = Math.floor((W * H) / 4000);
    const count = Math.min(Math.max(density, 200), 1200);
    stars = Array.from({ length: count }, () => newStar(true));
  }

  function newStar(randomDepth) {
    return {
      angle: Math.random() * Math.PI * 2,
      z: randomDepth ? Math.random() : 0,
      // Geschwindigkeit: bewusst langsam
      speed: 0.0008 + Math.random() * 0.0018,
      brightness: 0.4 + Math.random() * 0.6
    };
  }

  function animate() {
    // Sanfter Trail-Effekt statt komplettem Clear
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.z += s.speed;

      if (s.z >= MAX_DEPTH) {
        stars[i] = newStar(false);
        continue;
      }

      // Quadratisches Easing → sanfte Beschleunigung nach außen
      const eased = s.z * s.z;
      const dist = eased * Math.max(W, H) * 0.75;

      const x = CX + Math.cos(s.angle) * dist;
      const y = CY + Math.sin(s.angle) * dist;

      const size = 0.4 + eased * 2.2;
      const alpha = s.brightness * Math.min(1, eased * 1.5);

      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }

  // Reagiert auch auf Orientierungswechsel (Mobile)
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  resize();
  // Bei "reduzierter Bewegung" nur ein statisches Bild zeichnen
  if (prefersReduced) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    stars.forEach(s => {
      const eased = s.z * s.z;
      const dist = eased * Math.max(W, H) * 0.75;
      const x = CX + Math.cos(s.angle) * dist;
      const y = CY + Math.sin(s.angle) * dist;
      ctx.beginPath();
      ctx.arc(x, y, 0.4 + eased * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.brightness})`;
      ctx.fill();
    });
  } else {
    animate();
  }
})();
</script>
</body>
