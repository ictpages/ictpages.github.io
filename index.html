html,body{height:100%;margin:0}

/* Canvas als fixierter Hintergrund */
#starfield{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:-1;
  pointer-events:none;
  display:block;
}
/* Content über dem Hintergrund */
header,main,footer{position:relative;z-index:1}

/* Alles in Bildschirmhöhe, zentriert, kein Scrollen */
.content-wrap{
  height:100vh;
  height:100dvh;
  padding:0 20px;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

}

  h1{font-size:2rem}
  .ict-label{font-size:2rem}   /* bleibt gleich wie h1 */

  p{font-size:1rem}

<body>
<canvas id="starfield"></canvas>

<div class="content-wrap">
<header>
<center>

</center>
</header>

<main>

</center>

</center>
</footer>
</div>

<script>
(function(){
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, CX = 0, CY = 0;
  let stars = [];
  const MAX_DEPTH = 1;
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    CX = W / 2;
    CY = H / 2;

    canvas.width  = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    initStars();
  }

  function initStars() {
    const density = Math.floor((W * H) / 4000);
    const count = Math.min(Math.max(density, 200), 1200);
    stars = Array.from({ length: count }, () => newStar(true));
  }

  function newStar(randomDepth) {
    return {
      angle: Math.random() * Math.PI * 2,
      z: randomDepth ? Math.random() : 0,
      speed: 0.0008 + Math.random() * 0.0018,
      brightness: 0.4 + Math.random() * 0.6
    };
  }

  function animate() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.z += s.speed;

      if (s.z >= MAX_DEPTH) {
        stars[i] = newStar(false);
        continue;
      }

      const eased = s.z * s.z;
      const dist = eased * Math.max(W, H) * 0.75;

      const x = CX + Math.cos(s.angle) * dist;
      const y = CY + Math.sin(s.angle) * dist;

      const size = 0.4 + eased * 2.2;
      const alpha = s.brightness * Math.min(1, eased * 1.5);

      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.fill();
    }

    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  resize();
  if (prefersReduced) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    stars.forEach(s => {
      const eased = s.z * s.z;
      const dist = eased * Math.max(W, H) * 0.75;
      const x = CX + Math.cos(s.angle) * dist;
      const y = CY + Math.sin(s.angle) * dist;
      ctx.beginPath();
      ctx.arc(x, y, 0.4 + eased * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.brightness})`;
      ctx.fill();
    });
  } else {
    animate();
  }
})();
</script>
