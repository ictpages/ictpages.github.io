<style>

<body>
<canvas id="starfield" aria-hidden="true"></canvas>
<div class="content-wrap">
  <header>

      <a href="/" aria-label="ict.pages.dev home">ict.pages.dev</a>

  <span aria-hidden="true"> | </span>
  <a href="mailto:appdevsinfo@gmail.com" aria-label="Email ict.pages.dev">MAIL</a>
</h2>
  </main>
  <footer>
    <p>© 2026 ict.pages.dev</p>
  </footer>
</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d', {
    alpha: false,
    desynchronized: true
  });
  if (!ctx) return;
  let width = 0;
  let height = 0;
  let centerX = 0;
  let centerY = 0;
  let stars = [];
  let animationFrame = 0;
  const reducedMotion = window.matchMedia(
    '(prefers-reduced-motion: reduce)'
  ).matches;
  const MAX_DEPTH = 1;
  function createStar(randomDepth = true) {
    return {
      angle: Math.random() * Math.PI * 2,
      z: randomDepth ? Math.random() : 0,
      speed: 0.0008 + Math.random() * 0.0018,
      brightness: 0.4 + Math.random() * 0.6
    };
  }
  function initializeStars() {
    const density = Math.floor((width * height) / 5000);
    const count = Math.min(Math.max(density, 150), 800);
    stars = Array.from(
      { length: count },
      () => createStar(true)
    );
  }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    centerX = width / 2;
    centerY = height / 2;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initializeStars();
    if (reducedMotion) {
      drawStatic();
    }
  }
  function drawStatic() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, width, height);
    for (const star of stars) {
      const eased = star.z * star.z;
      const distance = eased * Math.max(width, height) * 0.75;
      const x = centerX + Math.cos(star.angle) * distance;
      const y = centerY + Math.sin(star.angle) * distance;
      const size = 0.4 + eased * 2.2;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${star.brightness})`;
      ctx.fill();
    }
  }
  function animate() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, width, height);
    const maxDistance = Math.max(width, height) * 0.75;
    for (let i = 0; i < stars.length; i++) {
      const star = stars[i];
      star.z += star.speed;
      if (star.z >= MAX_DEPTH) {
        stars[i] = createStar(false);
        continue;
      }
      const eased = star.z * star.z;
      const distance = eased * maxDistance;
      const x = centerX + Math.cos(star.angle) * distance;
      const y = centerY + Math.sin(star.angle) * distance;
      const size = 0.4 + eased * 2.2;
      const alpha = star.brightness * Math.min(1, eased * 1.5);
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.fill();
    }
    animationFrame = requestAnimationFrame(animate);
  }
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      cancelAnimationFrame(animationFrame);
      resize();
      if (!reducedMotion) {
        animate();
      }
    }, 100);
  }, { passive: true });
  resize();
  if (!reducedMotion) {
    animate();
  }
})();
</script>
</body>
