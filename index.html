<style>
body{margin:0;background:#000;color:#fff;font-family:"Raleway",Arial,sans-serif;line-height:1;overflow-x:hidden}
#s{position:fixed;inset:0;z-index:-1;pointer-events:none}
header,main,footer{position:relative;z-index:1;text-align:center;padding:0 20px}
h1{font-size:3.4rem}h3{font-size:3.5rem}p{font-size:1.4rem}
a{font-weight:bold;text-decoration:none;color:#4466ff}a:visited{color:#5577ff}

@media(max-width:600px){h1{font-size:2.2rem}h3{font-size:2rem}p{font-size:1.1rem}}

<body>
<canvas id="s"></canvas>
<header><h1><a href="/">ict.pages.dev</a></h1></header>
<main>
<img src="/AppDev.svg" width="200" alt="ict.pages.dev logo">
<h3><a href="tel:+31684725830">CALL</a> | <a href="mailto:appdevsinfo@gmail.com">MAIL</a></h3>
</main>
<footer><p>© 2026 ict.pages.dev</p></footer>
<script>
const c=document.getElementById('s'),x=c.getContext('2d');
let W,H,CX,CY,S=[];
const D=Math.random;
function init(){
  const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;CX=W/2;CY=H/2;
  c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
  S=Array.from({length:Math.min(1200,Math.max(200,W*H/4000))},()=>({
    a:D()*6.283,z:D(),v:.001+D()*.002,b:.4+D()*.6
  }));
}
function loop(){
  x.clearRect(0,0,W,H);
  for(const s of S){
    s.z+=s.v;
    if(s.z>=1){s.z=0;s.a=D()*6.283;s.v=.001+D()*.002;continue}
    const e=s.z*s.z,d=e*Math.max(W,H)*.75;
    x.beginPath();
    x.arc(CX+Math.cos(s.a)*d,CY+Math.sin(s.a)*d,.4+e*2.2,0,6.283);
    x.fillStyle=`rgba(255,255,255,${s.b*.5+e*.5})`;
    x.fill();
  }
  requestAnimationFrame(loop);
}
addEventListener('resize',init);init();loop();
</script>
</body>
