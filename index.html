<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ict.pages.dev</title>

<meta name="description" content="ict.pages.dev | ICT | Information & Communications Technology">

<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{background:#000;color:#fff;font:1.4rem/1.2 Arial,sans-serif;overflow:hidden}

h1,h2,p{margin:0}
h1,h2{font-weight:700;line-height:1.1}
a{color:#6688ff;font-weight:700;text-decoration:none}

#starfield{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:-1;pointer-events:none}

.content-wrap{width:100%;height:100vh;height:100dvh;padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:clamp(6px,1.2vh,16px);text-align:center}
header,main,footer{position:relative;z-index:1}

.logo{display:block;width:240px;height:auto;margin:auto}

@media(max-width:600px){
h1,h2{font-size:2.8rem}
body{font-size:1.1rem}
.logo{width:170px}
}
@media(min-width:601px){
h1,h2{font-size:clamp(1.8rem,4.2vw,2.6rem)}
body{font-size:clamp(.85rem,1.3vw,1.1rem)}
.content-wrap{gap:clamp(6px,1.4vh,16px)}
.logo{width:clamp(140px,18vh,220px)}
}
@media(min-width:1024px) and (min-height:600px){
h1{font-size:clamp(2rem,3vw,2.8rem)}
h2{font-size:clamp(1.4rem,2.2vw,2rem)}
body{font-size:clamp(.85rem,1vw,1.1rem)}
.logo{width:clamp(180px,24vh,260px)}
}
@media(prefers-reduced-motion:reduce){#starfield{display:none}}
</style>

</head>
<body>
<canvas id="starfield" aria-hidden="true"></canvas>
<div class="content-wrap">
<header>
<h1><a href="/" aria-label="ict.pages.dev home">ict.pages.dev</a></h1>
</header>
<main>
<img class="logo" src="/AppDev.svg" width="240" height="240" alt="ict.pages.dev" fetchpriority="high" decoding="async">
<h2>ICT</h2>
<br>
<h2><a href="/about">About</a></h2>
<br>
<h2><a href="tel:+31684725830" aria-label="Call ict.pages.dev">CALL</a><span aria-hidden="true"> | </span><a href="mailto:ict.pages.dev@gmail.com" aria-label="Email ict.pages.dev">MAIL</a></h2>
</main>
<footer>
  <p><strong><a href="/legal">Legal</a> | <a href="/privacy">Privacy</a></strong></p>
  <p>© 2026 ict.pages.dev</p>
</footer>
</div>

<script>
(()=>{"use strict";
const c=document.getElementById("starfield"),x=c.getContext("2d",{alpha:false});
if(!x)return;
let w,h,cx,cy,stars=[],frame,timer,running=!document.hidden;
const reduced=matchMedia("(prefers-reduced-motion:reduce)").matches;
const makeStar=(z=1)=>({a:Math.random()*6.283,z:z?Math.random():0,s:.0008+Math.random()*.0018,b:.4+Math.random()*.6});
function resize(){
const d=Math.min(devicePixelRatio||1,1.5);
w=innerWidth;h=innerHeight;cx=w/2;cy=h/2;
c.width=w*d;c.height=h*d;
x.setTransform(d,0,0,d,0,0);
stars=Array.from({length:300},()=>makeStar());
if(reduced)draw();
}
function draw(){
x.fillStyle="#000";
x.fillRect(0,0,w,h);
const max=Math.max(w,h)*.75;
for(const s of stars){
const e=s.z*s.z,d=e*max;
x.beginPath();
x.arc(cx+Math.cos(s.a)*d,cy+Math.sin(s.a)*d,.4+e*2.2,0,6.283);
x.fillStyle=`rgba(255,255,255,${s.b*Math.min(1,e*1.5)})`;
x.fill();
}
}
function animate(){
if(!running)return;
for(const s of stars)s.z+=s.s;
for(let i=0;i<stars.length;i++)if(stars[i].z>=1)stars[i]=makeStar(0);
draw();
frame=requestAnimationFrame(animate);
}
addEventListener("resize",()=>{
clearTimeout(timer);
timer=setTimeout(()=>{
cancelAnimationFrame(frame);
resize();
if(running&&!reduced)animate();
},100);
},{passive:true});
document.addEventListener("visibilitychange",()=>{
running=!document.hidden;
cancelAnimationFrame(frame);
if(running&&!reduced)animate();
});
resize();
if(!reduced)animate();
})();
</script>
</body>
</html>
